# SelfMachine Agents no Render (Blueprint).
# Mantem o MESMO banco (ia-central-db) e a MESMA Evolution (ia-central-evolution, com o disco das sessoes):
# os WhatsApps conectados continuam conectados. O n8n antigo nao esta mais aqui: depois da troca, suspenda-o no painel.
# Cria: Redis (Key Value) + API (webhooks) + Worker (filas e agentes).

databases:
  - name: ia-central-db
    databaseName: iacentral
    user: iacentral
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    region: virginia

envVarGroups:
  # segredos ja existentes, compartilhados com a Evolution (nao trocar: a Evolution usa a mesma chave)
  - name: ia-central-segredos
    envVars:
      - key: EVOLUTION_API_KEY
        generateValue: true
      - key: WHATSAPP_WEBHOOK_SEGREDO
        generateValue: true

  # configuracao comum da API e do worker
  - name: selfmachine-agents
    envVars:
      - key: SESSION_SECRET          # assina o login do painel
        generateValue: true
      - key: MONTHLY_BUDGET_USD
        value: "300"
      # Sentinela (somente leitura): chaves da Render e da Vercel
      - key: RENDER_API_KEY
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: NODE_ENV
        value: production
      - key: DB_SCHEMA
        value: app
      - key: WA_INSTANCES            # papel de cada instancia: ATENDIMENTO | GABRIEL | OBSERVAR | OFF
        sync: false
      - key: GABRIEL_PERSONAL_PHONE  # recebe aprovacoes e alertas
        sync: false
      - key: APPROVAL_INSTANCE       # instancia que manda rascunhos e aprovacoes (o numero do Gabriel = conversa "Voce")
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY       # opcional (modelo de reserva)
        sync: false
      - key: LLM_ROUTER_MODEL
        value: openai:gpt-5-mini
      - key: LLM_AGENT_MODEL
        value: openai:gpt-5
      - key: LLM_SMALL_MODEL
        value: openai:gpt-5-mini
      - key: LLM_SUMMARY_MODEL
        value: openai:gpt-5-mini
      - key: LLM_VISION_MODEL
        value: openai:gpt-5-mini
      - key: LLM_FALLBACK_MODEL      # vazio = sem reserva; ex.: anthropic:claude-sonnet-5-5
        sync: false
      - key: SEND_MODE               # draft = modo sombra (nada sai sozinho) | auto
        value: draft
      - key: AUTO_SEND_AGENTS        # ex.: CLARA,JOAO:WHATSAPP (libera por agente no modo draft)
        sync: false
      - key: SHADOW_NOTIFY           # true = manda cada rascunho do WhatsApp para o Gabriel ver
        value: "true"
      - key: MAX_AUTO_DISCOUNT_PERCENT
        value: "5"
      - key: DAILY_COST_LIMIT_USD
        value: "5"
      - key: BUSINESS_HOURS
        value: seg-sex 08:00-18:00
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD          # Bull Board em /admin/queues
        sync: false
      # Gmail (opcional: deixe GMAIL_ACCOUNT vazio para desligar)
      - key: GMAIL_ACCOUNT
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_PUSH_AUDIENCE
        sync: false
      - key: GMAIL_PUSH_SERVICE_ACCOUNT
        sync: false

services:
  # ------------------------------------------------------------------ Redis: filas, locks, takeover
  - type: keyvalue
    name: ia-central-redis
    plan: starter
    region: virginia
    maxmemoryPolicy: noeviction     # o BullMQ exige: nunca apagar job por falta de memoria
    ipAllowList: []                 # so rede interna

  # ------------------------------------------------------------------ API: webhooks (Evolution, Gmail), /health, filas
  - type: web
    name: ia-central-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    region: virginia
    healthCheckPath: /health
    preDeployCommand: node dist/src/scripts/migrar.js
    buildFilter:
      paths: [src/**, db/**, package.json, package-lock.json, Dockerfile]
    envVars:
      - fromGroup: ia-central-segredos
      - fromGroup: selfmachine-agents
      - key: PORT
        value: "3000"
      - key: PUBLIC_URL              # endereco publico desta API (ex.: https://ia-central-api.onrender.com)
        sync: false
      - key: WEBHOOK_BASE_URL        # a Evolution chama a API pela rede interna
        fromService: { type: web, name: ia-central-api, property: hostport }
      - key: DATABASE_URL
        fromDatabase: { name: ia-central-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: ia-central-redis, property: connectionString }
      - key: EVOLUTION_BASE_URL
        fromService: { type: web, name: ia-central-evolution, property: hostport }

  # ------------------------------------------------------------------ Worker: ingestao, agentes, envio, manutencao
  - type: worker
    name: ia-central-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/src/workers/index.js
    plan: 0.5c-512mb
    region: virginia
    buildFilter:
      paths: [src/**, db/**, package.json, package-lock.json, Dockerfile]
    envVars:
      - fromGroup: ia-central-segredos
      - fromGroup: selfmachine-agents
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_BASE_URL
        fromService: { type: web, name: ia-central-api, property: hostport }
      - key: DATABASE_URL
        fromDatabase: { name: ia-central-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: ia-central-redis, property: connectionString }
      - key: EVOLUTION_BASE_URL
        fromService: { type: web, name: ia-central-evolution, property: hostport }

  # ------------------------------------------------------------------ Painel (Centro de Comando): site estatico
  - type: web
    name: ia-central-painel
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths: [web/**]
    envVars:
      - key: VITE_API_URL
        value: https://ia-central-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: cache-control
        value: public, max-age=31536000, immutable

  # ------------------------------------------------------------------ Evolution API: WhatsApp
  - type: web
    name: ia-central-evolution
    runtime: docker
    dockerfilePath: ./deploy/evolution/Dockerfile
    dockerContext: ./deploy/evolution
    buildFilter:
      paths:
        - deploy/evolution/**
    plan: 0.5c-512mb
    region: virginia
    disk:
      name: evolution-sessoes
      mountPath: /evolution/instances
      sizeGB: 1
    envVars:
      - fromGroup: ia-central-segredos
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: SERVER_URL
        value: http://localhost:8080
      - key: BANCO_URL
        fromDatabase: { name: ia-central-db, property: connectionString }
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      # n8n fora do ar (ex.: banco reiniciando): a Evolution reenvia a mensagem por ~3h em vez de ~20 min
      # (padrao: 10 tentativas). Mensagem que chega atrasada e so lida/aprendida, a IA nao responde.
      - key: WEBHOOK_RETRY_MAX_ATTEMPTS
        value: "40"
      - key: WEBHOOK_RETRY_MAX_DELAY_SECONDS
        value: "300"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE      # nao guarda mensagens: as IAs leem as novas na hora (webhook)
        value: "false"
      - key: DATABASE_SAVE_DATA_HISTORIC         # nem o historico (pesava no banco pequeno)
        value: "false"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "false"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "false"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Nucleo IA
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: QRCODE_LIMIT
        value: "30"
      - key: DEL_INSTANCE
        value: "false"
      - key: LOG_LEVEL
        value: ERROR,WARN
      - key: TZ
        value: America/Sao_Paulo
